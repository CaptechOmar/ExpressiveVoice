name: Build & Release

# Every push to any branch (or a manual run) builds ONE signed APK and creates:
#   - a published pre-release  "beta-<run number>"   (ready to install)
#   - a DRAFT stable release   "v<base>.<run number>" (edit the notes, then press Publish)
# Both carry the same APK. They share one applicationId and signing key, and versionCode
# comes from the run number (only ever goes up), so every build - beta or stable - installs
# over the previous one without uninstalling.
#
# Change VERSION_BASE below to bump the major/minor version (e.g. 1.1).

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'prev/**', 'fastlane/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_BASE: '1.0'
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out version
        id: ver
        run: |
          RUN="${GITHUB_RUN_NUMBER}"
          echo "code=$((1000 + RUN))" >> "$GITHUB_OUTPUT"   # always increasing
          echo "name=${VERSION_BASE}.${RUN}" >> "$GITHUB_OUTPUT"
          echo "beta_tag=beta-${RUN}" >> "$GITHUB_OUTPUT"
          echo "stable_tag=v${VERSION_BASE}.${RUN}" >> "$GITHUB_OUTPUT"

      - name: Decode signing key
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build APK
        env:
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          KEYSTORE_PATH: ${{ env.HAS_KEYSTORE == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Verify signature and name the APK
        id: apk
        run: |
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n1)"
          OUT="RecordMaster-${{ steps.ver.outputs.name }}.apk"
          cp "$APK" "$OUT"
          if [[ "$HAS_KEYSTORE" == "true" ]]; then
            APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
            "$APKSIGNER" verify --print-certs "$OUT" | tee cert.txt
          else
            echo "::warning::No signing key configured - this APK is unsigned and cannot be installed."
          fi
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}

      - name: Publish beta pre-release
        if: env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.beta_tag }}
          target_commitish: ${{ github.sha }}
          name: RecordMaster beta ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: ${{ steps.apk.outputs.file }}

      - name: Remove older stable drafts
        if: env.HAS_KEYSTORE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep a single pending stable draft (the newest build) instead of piling them up.
          gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '.[] | select(.draft) | .id' |
            while read -r id; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"; done

      - name: Create stable release draft
        if: env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.stable_tag }}
          target_commitish: ${{ github.sha }}
          name: RecordMaster ${{ steps.ver.outputs.name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.apk.outputs.file }}

      - name: Release skipped (no signing key)
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::error::Add the KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD repository secrets to publish releases." && exit 1
