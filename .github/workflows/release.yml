name: Build & Release

# Beta:    every push to ANY branch (or a manual run) -> pre-release "beta-<run number>"
# Stable:  push a tag like v1.2.0                     -> normal release "v1.2.0"
# Both are signed with the same key and share one applicationId, so each build installs
# over the previous one (beta -> beta, beta -> stable, stable -> beta) as long as its
# versionCode is higher. versionCode comes from the run number, which only ever goes up.

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md', 'prev/**', 'fastlane/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out version
        id: ver
        run: |
          RUN="${GITHUB_RUN_NUMBER}"
          # Always increasing across beta AND stable runs of this workflow.
          echo "code=$((1000 + RUN))" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "kind=stable" >> "$GITHUB_OUTPUT"
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            LAST="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
            LAST="${LAST#v}"
            echo "kind=beta" >> "$GITHUB_OUTPUT"
            echo "name=${LAST:-1.0.0}-beta.${RUN}" >> "$GITHUB_OUTPUT"
            echo "tag=beta-${RUN}" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode signing key
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build APK
        env:
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          KEYSTORE_PATH: ${{ env.HAS_KEYSTORE == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Verify signature and name the APK
        id: apk
        run: |
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n1)"
          OUT="ExpressiveVoice-${{ steps.ver.outputs.name }}.apk"
          cp "$APK" "$OUT"
          if [[ "$HAS_KEYSTORE" == "true" ]]; then
            APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
            "$APKSIGNER" verify --print-certs "$OUT" | tee cert.txt
          else
            echo "::warning::No signing key configured - this APK is unsigned and cannot be installed."
          fi
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}

      - name: Pick release notes
        id: notes
        run: |
          # A stable tag like v2.0 uses .github/release-notes/v2.0.md when it exists.
          if [[ -f ".github/release-notes/${{ steps.ver.outputs.tag }}.md" ]]; then
            echo "path=.github/release-notes/${{ steps.ver.outputs.tag }}.md" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.ver.outputs.kind == 'stable' && format('Expressive Voice {0}', steps.ver.outputs.name) || format('Expressive Voice beta {0}', github.run_number) }}
          prerelease: ${{ steps.ver.outputs.kind == 'beta' }}
          make_latest: ${{ steps.ver.outputs.kind == 'stable' }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          files: ${{ steps.apk.outputs.file }}

      - name: Release skipped (no signing key)
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::error::Add the KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD repository secrets to publish releases." && exit 1
